# MySQL configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:192.168.56.102}:${MYSQL_PORT:3306}/${MYSQL_DB:authservice}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true

# MySQL username/password
spring.datasource.username=root
spring.datasource.password=PASSWORD

# Show SQL queries
spring.jpa.show-sql=true

# Other configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.properties.hibernate.hbm2ddl.auto=update

# Spring Boot server port
server.port=9898

logging.level.org.springframework.security=DEBUG
logging.level.your.package.name=DEBUG
logging.level.org.example=DEBUG

spring.cloud.compatibility-verifier.enabled=false

# Kafka Configuration
spring.kafka.bootstrap-servers=192.168.56.102:9092
spring.kafka.topic.name=testing_json
spring.kafka.producer.value.serializer=org.example.serializer.UserInfoSerializer
