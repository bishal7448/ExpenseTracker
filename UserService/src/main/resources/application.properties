spring.application.name=UserService

# Kafka Configuration
spring.kafka.bootstrap-servers=192.168.56.102:9092
spring.kafka.consumer.properties.max.poll.interval.ms=300000
spring.kafka.consumer.properties.session.timeout.ms=45000
spring.kafka.topic.name=user_service
spring.kafka.consumer.group-id=userinfo-consumer-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.example.UserService.deserializer.UserInfoDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.UserService.models
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.properties.spring.json.type.mapping=auth:com.example.UserService.models.UserInfoDto

# MySQL configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:192.168.56.102}:${MYSQL_PORT:3306}/${MYSQL_DB:userservice}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true

# MySQL username/password
spring.datasource.username=root
spring.datasource.password=PASSWORD

# Show SQL queries
spring.jpa.show-sql=true

# Other configurations
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.properties.hibernate.hbm2ddl.auto=update

# Spring Boot server port
server.port=9810

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10

logging.level.org.springframework.security=DEBUG
logging.level.org.apache.kafka=DEBUG
logging.level.org.springframework.kafka=DEBUG
